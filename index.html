<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>MACROXEL Control Central</title>
<style>html,body{margin:0;width:100%;height:100%;background:#03142b}#mxLoader{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui;background:#03142b;text-align:center;padding:24px}</style>
</head>
<body>
<div id="mxLoader">Conectando con Macroxel Hospital…</div>
<script>
/* MACROXEL v1.0.215 · entrada GitHub dinámica, sin Firebase fija */
(function(){'use strict';
  const LICENSE_HOST='licenciasmacroxel-default-rtdb.firebaseio.com';
  const routeKey='mx_route_operational_db_v1208::'+location.origin+location.pathname.replace(/\/index\.html?$/i,'/');
  const clean=v=>String(v||'').trim().replace(/\.json\/?$/i,'').replace(/\/+$/,'');
  const valid=v=>{try{const u=new URL(clean(v)),h=u.hostname.toLowerCase();return u.protocol==='https:'&&/(?:firebaseio\.com|firebasedatabase\.app)$/i.test(h)&&h!==LICENSE_HOST?clean(v):''}catch(_e){return''}};
  let q='';try{const p=new URLSearchParams(location.search);q=valid(p.get('mxDb')||p.get('firebase')||p.get('db')||'')}catch(_e){}
  if(q){try{localStorage.setItem(routeKey,q)}catch(_e){}}
  let saved='';try{saved=valid(localStorage.getItem(routeKey)||'')}catch(_e){}
  window.mxBoundOperationalDb=()=>q||saved;
  window.mxRouteIsolationKey=routeKey;
})();
(()=>{
  const CENTRAL_BASE='https://sistemasmacroxel-create.github.io/ECOSISTEMA-MACROXEL-HOSPITAL/MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/';
  const SOURCES=[
    'https://raw.githubusercontent.com/sistemasmacroxel-create/ECOSISTEMA-MACROXEL-HOSPITAL/main/MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html',
    'https://raw.githubusercontent.com/sistemasmacroxel-create/ECOSISTEMA-MACROXEL-HOSPITAL/f0c945022ef1ed0358c970855d74abd6ccad375d/MACROXEL-VISORES-CENTRAL/CONTROL-CENTRAL/index.html',
    CENTRAL_BASE+'index.html'
  ];
  /* Macroxel HPS v322: preservar lotes con 0 piezas en el CONTEO ALMACEN.
     Se modifica al cargar el HTML actual; no se sustituye por una copia vieja. */
  function includeZeroWarehouseRows(html){
    const oldFilter="if(state.mode==='almacen')return state.rows.filter(r=>num(r?.almacen)>0);";
    if(!html.includes(oldFilter)){
      console.warn('[MACROXEL v322] Filtro Conteo Almacen no encontrado; verifica version.');
      return html;
    }
    html=html.replace(oldFilter,"if(state.mode==='almacen')return state.rows;");
    const anchor=/async function canonicalInventoryPayload\(force=false\)\{[\s\S]*?\}(?=\s*async function refreshInBackground\()/;
    const updated=String.raw`async function canonicalInventoryPayload(force=false){
  const br=await exactBranch(false),hub=window.mxSharedInventoryHub;
  if(!hub?.allLotsRows)throw new Error('Inventario compartido no disponible.');
  const normal=await hub.allLotsRows(force),rows=Array.isArray(normal)?normal.slice():[];
  // Lotes con 0 ALMACEN/0 ESTANTES: nunca agregarlos al modulo de transferencias.
  // La fuente autoritativa es inventory_lots_by_key del Sistema Principal.
  const normKey=v=>txt(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  const identity=r=>txt(r.inventoryId)||[normKey(r.clave),normKey(r.lote),normKey(r.caducidad)].join('|');
  const seen=new Set(rows.map(identity));
  let root=null;
  try{root=await window.mxCpmCache?.preloadLots?.(force)}catch(_e){}
  const catalog=window.mxCpmCache?.getLocal?.()||[],byKey=new Map();
  if(Array.isArray(catalog))for(const p of catalog){const c=normKey(p?.clave||p?.csg||p?.codigo);if(c)byKey.set(c,p)}
  for(const [k,payload] of Object.entries(root||{})){
    if(!payload||!Array.isArray(payload.items))continue;
    let clave=normKey(payload.c);
    if(!clave)try{const raw=k.replace(/-/g,'+').replace(/_/g,'/');clave=normKey(decodeURIComponent(escape(atob(raw+'='.repeat((4-raw.length%4)%4)))))}catch(_e){}
    if(!clave)continue;
    const cat=byKey.get(clave)||{},descripcion=txt(cat.descripcion||cat.nombre||clave);
    for(const a of payload.items){
      if(!Array.isArray(a)||a.length<6)continue;
      const almacen=Math.max(0,num(a[4])),estantes=Math.max(0,num(a[5]));
      if(almacen>0||estantes>0)continue;
      const r={inventoryId:txt(a[0]),clave,descripcion,lote:txt(a[1]),caducidad:txt(a[2]),
        codigo_barras:txt(a[3]),almacen:0,estantes:0,existencia:0,unidad:txt(a[6]||cat.unidad),
        clasificacion:txt(a[7]||cat.clasificacion),restriccion:txt(a[8]||cat.restriccion),
        ubicacion:txt(a[9])};
      const id=identity(r);if(!seen.has(id)){seen.add(id);rows.push(r)}
    }
  }
  return{br,payload:{items:rows,meta:{updatedAt:new Date().toISOString(),updatedAtText:'Inventario Principal: lotes con y sin existencias'}}};
}`;
    if(!anchor.test(html)){
      console.warn('[MACROXEL v322] Carga del Conteo no localizada; no se aplico transformacion.');
      return html;
    }
    return html.replace(anchor,updated);
  }
  function render(html){
    html=includeZeroWarehouseRows(html);
    if(!/<html(?:\s|>)/i.test(html))throw new Error('Contenido central inválido');
    if(!/<base\s/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+CENTRAL_BASE+'">');
    document.open();document.write(html);document.close();
  }
  async function fetchSource(src){
    const sep=src.includes('?')?'&':'?';
    const r=await fetch(src+sep+'mxv=1.0.215&t='+Date.now(),{cache:'no-store',mode:'cors'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    if(!/<html(?:\s|>)/i.test(html))throw new Error('Contenido central inválido');
    return html;
  }
  (async()=>{
    let lastErr=null;
    for(const src of SOURCES){
      try{render(await fetchSource(src));return}catch(err){lastErr=err}
    }
    const e=document.getElementById('mxLoader');if(e)e.innerHTML='No se pudo cargar Macroxel Hospital.<br><small style="opacity:.75">No se pudo recuperar el código del Control Central. Actualiza la página en unos segundos.</small>';
    console.error(lastErr);
  })();
})();
</script>
</body>
</html>
